<style>
:root {
  --bg: #F3F1EA; --panel: #FFFFFF; --ink: #24272A; --muted: #6B7068; --line: #DEDCD2; --soft: #ECEAE1;
  --green: #1F5A36; --green-soft: #E3EDE5; --ok: #2F7A4F; --warn: #A8641A; --bad: #B23A32; --accent: #34477A;
  --display: "Gowun Batang", "Noto Serif KR", serif; --body: "Noto Sans KR", -apple-system, system-ui, sans-serif;
  --tabh: 62px; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 24px); }

header.top .who button { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: 12px; cursor: pointer; }
h2 { font-family: var(--display); font-size: 19px; color: var(--green); margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 small { font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 400; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.brief p { margin: 0 0 2px; font-variant-numeric: tabular-nums; } .brief p.big { font-weight: 700; font-size: 17px; margin-bottom: 4px; color: #8E2A22; } .brief p.gap { margin-top: 12px; }
.hero { display: block; width: 100%; height: auto; border-radius: 14px; margin: 0 0 4px; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.note { font-size: 12.5px; background: #FBF3E6; border: 1px solid #EBD7B4; color: #7A4B12; border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.kpi .k { font-size: 12px; color: var(--muted); } .kpi .v { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.3; } .kpi .s { font-size: 12px; color: var(--muted); }
.prog { margin: 10px 0; } .prog .row { display: flex; justify-content: space-between; font-size: 13.5px; gap: 8px; }
.prog .row b { font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 4px; position: relative; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: color-mix(in srgb, var(--bad) 78%, var(--ink)); }
.bar > i.ok { background: var(--ok); }
.bar > em { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chip.bad { border-color: #E2B5B0; background: #FBEDEB; color: var(--bad); } .chip.warn { border-color: #EBD7B4; background: #FBF3E6; color: var(--warn); }
.chip.ok { border-color: #BCD8C5; background: var(--green-soft); color: var(--green); }

.task .m { font-size: 12px; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; margin-top: 2px; }
.task .m .late { color: var(--bad); font-weight: 500; }
.task .m select { font-size: 12px; padding: 1px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.goal { display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
.goal .no { width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.goal .t { font-weight: 700; } .goal .ms { font-size: 13px; color: var(--muted); }
.hb { display: grid; grid-template-columns: 7.5em 1fr auto; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; }

.hb .track { height: 10px; background: var(--soft); border-radius: 99px; overflow: hidden; } .hb .track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.hb .val { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.post .ttl { font-weight: 700; margin: 2px 0 6px; } .post ul { margin: 0; padding-left: 18px; } .post li { margin: 2px 0; }
.post .ask { margin-top: 8px; font-size: 13px; background: var(--green-soft); border-radius: 10px; padding: 8px 10px; }
.post .ask b { color: var(--green); }
.badge { font-size: 11px; border-radius: 6px; padding: 0 6px; background: var(--soft); color: var(--muted); }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 8px; scrollbar-width: none; } .seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--green); border-color: var(--green); color: #fff; }
.field { display: grid; gap: 4px; margin-bottom: 10px; } .field > span { font-size: 12.5px; color: var(--muted); }
input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], textarea, select.in { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; font-size: 16px; }
textarea { min-height: 70px; resize: vertical; }
.btn { appearance: none; border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--green); color: #fff; width: 100%; font-size: 16px; cursor: pointer; }
.btn.ghost { background: var(--panel); color: var(--green); border: 1px solid var(--green); }
.btn:disabled { opacity: .5; }

nav.tabs button { height: var(--tabh); background: none; border: 0; display: grid; place-items: center; align-content: center; gap: 2px; font-size: 11px; color: var(--muted); cursor: pointer; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
nav.tabs button[aria-current=page] { color: var(--green); font-weight: 700; }
.dot { display: inline-block; min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; line-height: 16px; padding: 0 4px; }
.login { max-width: 380px; margin: 12vh auto 0; padding: 0 20px; }

.err { color: var(--bad); font-size: 13px; min-height: 1.4em; margin: 6px 0; }
.linkbtn { background: none; border: 0; color: var(--green); text-decoration: underline; font-size: 13px; cursor: pointer; padding: 6px 0; }
.empty { color: var(--muted); font-size: 13.5px; padding: 6px 0; }
.spark { width: 100%; height: 120px; display: block; }
[hidden] { display: none !important; }
.idea { padding: 7px 0; border-bottom: 1px solid var(--line); } .idea:last-of-type { border-bottom: 0; } .idea { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; font-size: 14px; line-height: 1.55; } .idea .no { margin-top: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--green); color: #fff; font-size: 12px; display: inline-grid; place-items: center; } .idea .small { margin-top: 2px; } .ord { padding: 7px 0; border-bottom: 1px solid var(--line); } .ord:last-of-type { border-bottom: 0; } .ord .row { display: flex; justify-content: space-between; gap: 8px; }
.bf .bfh { font-weight: 700; font-size: 14px; margin: 14px 0 6px; } .bf .bfh:first-child { margin-top: 0; } .bf p { margin: 4px 0; } .bfw { padding: 5px 0; font-size: 13.5px; border-bottom: 1px solid var(--line); } .bfw:last-child { border-bottom: 0; } .tx-bad { color: var(--bad); } .tx-warn { color: var(--warn); } .tx-ok { color: var(--ok); }
.arow { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; } .arow:last-of-type { border-bottom: 0; } .arow .t { overflow-wrap: anywhere; }
/* 노트북·큰 화면 (900px 이상): 위쪽 탭, 사진 가로 띠, 홈 2단 */
@media (min-width: 900px) {
  .wrap { max-width: 1120px; padding: 84px 28px 40px; }
  nav.tabs { top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); padding: 0 max(28px, calc(50% - 532px)); grid-template-columns: repeat(5, 120px); justify-content: end; }
  nav.tabs button { height: 56px; grid-auto-flow: column; gap: 6px; font-size: 14px; }
  nav.tabs button svg { width: 18px; height: 18px; }
  header.top { position: fixed; top: 0; left: max(28px, calc(50% - 532px)); height: 56px; align-items: center; z-index: 6; margin: 0; gap: 18px; }
  header.top h1 { font-size: 22px; }
  header.top .who br { display: none; } header.top .who button { margin-left: 8px; }
  .hero { height: 220px; object-fit: cover; object-position: 50% 42%; margin-bottom: 8px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  section[data-page]:not([data-page=home]) { max-width: 820px; margin: 0 auto; }
  .kpis { grid-template-columns: repeat(4, 1fr); }
}

</style>

<body>

<div id="app" hidden>

  <nav class="tabs" aria-label="메뉴">
    <button data-go="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button data-go="sales"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>매출</button>
    <button data-go="work"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>업무</button>
    <button data-go="store"><svg viewBox="0 0 24 24"><path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16M9 20v-6h6v6"/></svg>매장</button>
    <button data-go="posts"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>보고함</button>
  </nav>
</div>

<script src="supabase.js"></script>
<script>
const SB_URL = 'https://zplpmnfkasoniqnulknv.supabase.co';
const SB_KEY = 'sb_publishable_DTB6nlnzTdsCdqTQ9vz1WQ_HIu0d1mc';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'bottari-auth' } });
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = (n) => n == null || isNaN(n) ? '—' : Math.round(+n).toLocaleString('ko-KR') + '원';
const man = (n) => (+n / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 1 }) + '만';
const pct = (x, d = 1) => x == null || !isFinite(x) ? '—' : (x * 100).toFixed(d) + '%';
const DOW = '일월화수목금토';
const md = (s) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const kst = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const mondayOf = (iso) => { const d = new Date(iso + 'T00:00:00Z'); const w = d.getUTCDay(); d.setUTCDate(d.getUTCDate() + (w === 0 ? 1 : 1 - w)); return d.toISOString().slice(0, 10); };
const lastDay = (iso) => { const d = new Date(iso + 'T00:00:00Z'); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate(); };

let ME = null, DB = {}, page = 'home', storeDate = kst(), postFilter = '전체', taskView = '이번 주';
const COLS = ['report', 'tasks', 'goals', 'months', 'posts', 'storelog', 'carpet', 'staff'];

/* ---------- 로그인 ---------- */
let signupMode = false;
$('#l-mode').onclick = () => { signupMode = !signupMode; $('#l-go').textContent = signupMode ? '비밀번호 만들고 시작하기' : '로그인'; $('#l-mode').textContent = signupMode ? '이미 비밀번호가 있어요 — 로그인' : '처음이신가요? 비밀번호 만들기'; $('#l-err').textContent = signupMode ? '등록된 이메일만 가입됩니다. 비밀번호는 8자 이상.' : ''; };
$('#l-go').onclick = async () => {
  const email = $('#l-email').value.trim(), password = $('#l-pw').value;
  $('#l-err').textContent = ''; $('#l-go').disabled = true;
  try {
    if (signupMode) {
      if (password.length < 8) throw new Error('비밀번호는 8자 이상으로 정해 주세요.');
      const { error } = await sb.auth.signUp({ email, password });
      if (error) throw new Error(/not_allowed|Database error/i.test(error.message) ? '등록되지 않은 이메일입니다.' : /already/i.test(error.message) ? '이미 가입된 이메일입니다. 로그인해 주세요.' : error.message);
    }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw new Error(/Invalid login/i.test(error.message) ? '이메일 또는 비밀번호가 맞지 않습니다.' : error.message);
    await boot();
  } catch (e) { $('#l-err').textContent = e.message; }
  $('#l-go').disabled = false;
};
$('#logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#login').hidden = false; $('#app').hidden = true; return; }
  const email = session.user.email.toLowerCase();
  const { data: staff } = await sb.from('staff').select('*');
  ME = (staff || []).find((s) => s.email.toLowerCase() === email);
  if (!ME) { $('#login').hidden = false; $('#l-err').textContent = '등록되지 않은 계정입니다.'; await sb.auth.signOut(); return; }
  DB.staff = staff;
  $('#login').hidden = true; $('#app').hidden = false; $('#who').textContent = ME.name;
  await loadAll(); render();
  sb.channel('docs').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, (p) => {
    const r = p.new && p.new.collection ? p.new : p.old; if (!r) return;
    DB[r.collection] = DB[r.collection] || {};
    if (p.eventType === 'DELETE') delete DB[r.collection][r.id]; else DB[r.collection][r.id] = { ...p.new };
    render();
  }).subscribe();
}
async function loadAll() {
  const { data, error } = await sb.from('docs').select('collection,id,data,version,updated_at').in('collection', COLS);
  if (error) { alert('자료를 불러오지 못했습니다: ' + error.message); return; }
  for (const c of COLS) if (c !== 'staff') DB[c] = {};
  for (const r of data) DB[r.collection][r.id] = r;
}
const rows = (c) => Object.values(DB[c] || {});
const rep = (id) => DB.report?.[id]?.data || {};
async function save(collection, id, data) {
  const { error } = await sb.from('docs').upsert({ collection, id, data });
  if (error) { alert('저장하지 못했습니다: ' + error.message); return false; }
  DB[collection] = DB[collection] || {}; DB[collection][id] = { ...(DB[collection][id] || {}), collection, id, data };
  return true;
}

/* ---------- 탭 ---------- */
document.querySelectorAll('nav.tabs button').forEach((b) => b.onclick = () => { page = b.dataset.go; render(); window.scrollTo(0, 0); });
function render() {
  document.querySelectorAll('nav.tabs button').forEach((b) => b.setAttribute('aria-current', b.dataset.go === page ? 'page' : 'false'));
  document.querySelectorAll('section[data-page]').forEach((s) => s.hidden = s.dataset.page !== page);
  ({ home: drawHome, sales: drawSales, work: drawWork, store: drawStore, posts: drawPosts })[page]($(`section[data-page=${page}]`));
}

/* ---------- 매출 계산 (일일보고와 같은 규칙) ---------- */
function calc() {
  const daily = (rep('daily').rows || []).map((d) => ({ ...d, online: +d.cafe24 + +d.smart + +d.ohouse, total: +d.store + +d.cafe24 + +d.smart + +d.ohouse }));
  if (!daily.length) return null;
  const y = daily[daily.length - 1], month = y.day.slice(0, 7), dom = +y.day.slice(8, 10);
  const yy = +month.slice(0, 4), mm = +month.slice(5, 7), dim = lastDay(y.day);
  let bdays = 0, elapsed = 0;
  for (let i = 1; i <= dim; i++) if (new Date(Date.UTC(yy, mm - 1, i)).getUTCDay() !== 1) { bdays++; if (i <= dom) elapsed++; }
  const pm = new Date(Date.UTC(yy, mm - 2, 1)).toISOString().slice(0, 7);
  const cur = daily.filter((d) => d.day.slice(0, 7) === month), prevAll = daily.filter((d) => d.day.slice(0, 7) === pm), prev = prevAll.filter((d) => +d.day.slice(8, 10) <= dom);
  const sum = (r, f) => r.reduce((s, d) => s + (+d[f] || 0), 0);
  const back = (n) => { const t = new Date(y.day + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() - n); return t.toISOString().slice(0, 10); };
  const w7 = daily.filter((d) => d.day > back(7)), tx7 = sum(w7, 'store_tx');
  const lw = daily.find((d) => d.day === back(7));

  const goals = rows('goals').filter((g) => g.data.month === m).sort((a, b) => (a.data.createdAt || '').localeCompare(b.data.createdAt || ''));
  const all = rows('tasks').map((r) => ({ id: r.id, ...r.data })).filter((t) => t.month === m).map((t) => ({ ...t, ...effWeek(t, wk) }));
  const views = ['이번 주', '전체', '구민영 대표', '송매니저', '공동'];
  let list = taskView === '이번 주' ? all.filter((t) => t.week === wk) : taskView === '전체' ? all : all.filter((t) => t.owner === taskView);
  list.sort((a, b) => (a.status === '완료') - (b.status === '완료') || (a.due || '').localeCompare(b.due || ''));
  const done = all.filter((t) => t.status === '완료').length, live = all.filter((t) => t.status !== '보류').length;
  const mon = DB.months?.[m]?.data || { month: m };
  el.innerHTML = `
  <h2 style="margin-top:4px">이달의 핵심 목표<small>${+m.slice(5)}월 · ${goals.length}개</small></h2>
  ${goals.map((g, i) => `<div class="card goal" data-id="${g.id}"><div class="no">${i + 1}</div><div><div class="t">${esc(g.data.title)}</div><div class="ms">측정 · ${esc(g.data.measure)}</div>
    <div class="field" style="margin:8px 0 0"><span>결과</span><textarea data-goal="${g.id}" placeholder="월말에 적어 주세요">${esc(g.data.result || '')}</textarea></div></div></div>`).join('') || '<div class="card empty">이달 목표가 없습니다.</div>'}
  <h2>업무 리스트<small>완료 ${done}/${live}</small></h2>
  <div class="seg">${views.map((v) => `<button aria-pressed="${v === taskView}" data-v="${v}">${v}</button>`).join('')}</div>
  <div class="card">${list.length ? list.map(taskRow).join('') : '<div class="empty">해당 업무가 없습니다.</div>'}</div>
  <details class="card"><summary style="cursor:pointer;font-weight:500">＋ 업무 추가</summary>
    <div style="margin-top:10px"><div class="field"><span>업무</span><input type="text" id="n-title"></div>
    <div class="field"><span>담당</span><select class="in" id="n-owner"><option>구민영 대표</option><option>송매니저</option><option>공동</option></select></div>
    <div class="field"><span>분야</span><select class="in" id="n-cat"><option>매장 운영</option><option>온라인</option><option>상품·발주</option><option>마케팅</option><option>기타</option></select></div>
    <div class="field"><span>기한 (말일로 정하면 한 달 내내 하는 상시 업무)</span><input type="date" id="n-due"></div>
    <button class="btn" id="n-add">추가</button></div></details>
  <h2>월말 회고<small>회의일 ${md(mon.meetingDate || '')}</small></h2>
  <div class="card">${[['good', '잘한 점'], ['bad', '아쉬운 점'], ['next', '다음 달에 이어갈 것']].map(([k, l]) => `<div class="field"><span>${l}</span><textarea data-retro="${k}">${esc(mon[k] || '')}</textarea></div>`).join('')}<div class="saved" id="r-saved"></div></div>`;
  bindTasks(el);
  el.querySelectorAll('.seg button').forEach((b) => b.onclick = () => { taskView = b.dataset.v; render(); });
  el.querySelectorAll('[data-goal]').forEach((t) => t.onchange = async () => { const id = t.dataset.goal; await save('goals', id, { ...DB.goals[id].data, result: t.value }); });
  el.querySelectorAll('[data-retro]').forEach((t) => t.onchange = async () => { const d = { ...(DB.months?.[m]?.data || { month: m }), [t.dataset.retro]: t.value, updatedAt: new Date().toISOString() }; if (await save('months', m, d)) $('#r-saved').textContent = '저장했습니다'; });
  $('#n-add').onclick = async () => {
    const title = $('#n-title').value.trim(), due = $('#n-due').value; if (!title || !due) { alert('업무와 기한을 적어 주세요.'); return; }
    const id = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    if (await save('tasks', id, { title, owner: $('#n-owner').value, category: $('#n-cat').value, priority: '상', level: '월간', month: due.slice(0, 7), due, week: mondayOf(due), status: '대기', result: '', doneAt: '', createdAt: new Date().toISOString() })) render();
  };
}

/* ---------- 매장 입력 ---------- */
const AGES = ['10대', '20대 초중반', '20대 후반', '30대', '40대', '50대 이상'];
function drawStore(el) {
  const d = storeDate, cur = DB.storelog?.[d]?.data || {};
  const v = { visitors: 0, buyers: 0, ages: {}, buyAges: {}, items: '', memo: '', ...cur };
  const m = d.slice(0, 7), logs = rows('storelog').filter((r) => r.id.startsWith(m)).sort((a, b) => b.id.localeCompare(a.id));
  const tot = logs.reduce((s, r) => ({ v: s.v + (+r.data.visitors || 0), b: s.b + (+r.data.buyers || 0) }), { v: 0, b: 0 });
  const ageTot = {}; logs.forEach((r) => AGES.forEach((a) => ageTot[a] = (ageTot[a] || 0) + (+(r.data.ages || {})[a] || 0)));
  const carpets = rows('carpet').filter((r) => r.data.day?.startsWith(m));
  el.innerHTML = `
  <h2 style="margin-top:4px">방문 고객 기록<small>11월 목표 · 오프라인 고객 정보 수집</small></h2>
  <div class="card">
    <div class="field"><span>날짜</span><input type="date" id="s-date" value="${d}"></div>
    <div class="counter"><span>방문객 수</span><span class="ctl"><button data-k="visitors" data-d="-1">−</button><b>${v.visitors}</b><button data-k="visitors" data-d="1">＋</button></span></div>
    <div class="counter"><span>구매 고객 수</span><span class="ctl"><button data-k="buyers" data-d="-1">−</button><b>${v.buyers}</b><button data-k="buyers" data-d="1">＋</button></span></div>
    <div class="small muted" style="margin:12px 0 2px">연령대별 방문 (보이는 대로)</div>
    ${AGES.map((a) => `<div class="counter"><span>${a}</span><span class="ctl"><button data-age="${a}" data-d="-1">−</button><b>${+(v.ages[a] || 0)}</b><button data-age="${a}" data-d="1">＋</button></span></div>`).join('')}
    <div class="field" style="margin-top:12px"><span>많이 보거나 산 상품 (연령대와 함께)</span><textarea id="s-items" placeholder="예) 20대 초반 2명 — 청귤보이차 티백, 코스터 구매">${esc(v.items)}</textarea></div>
    <div class="field"><span>특이사항 (날씨·행사·문의 등)</span><textarea id="s-memo">${esc(v.memo)}</textarea></div>
    <div class="saved" id="s-saved">${cur.updatedAt ? '저장됨 · ' + cur.updatedAt.slice(11, 16) + ' ' + esc(cur.by || '') : ''}</div>
  </div>
  <h2>${+m.slice(5)}월 누계<small>${logs.length}일 기록</small></h2>
  <div class="card"><div class="kpis"><div class="kpi"><div class="k">방문객</div><div class="v">${tot.v}명</div></div><div class="kpi"><div class="k">구매 고객</div><div class="v">${tot.b}명</div><div class="s">구매 전환 ${tot.v ? pct(tot.b / tot.v, 0) : '—'}</div></div></div>
    <div style="margin-top:10px">${hbars(AGES.map((a) => ({ a, n: ageTot[a] || 0 })), (r) => r.a, (r) => r.n, (r) => r.n + '명')}</div></div>
  <h2>카페트 판매 기록<small>매장 매출에서 빼고 별도 표시</small></h2>
  <div class="card"><div class="field"><span>판매일</span><input type="date" id="c-day" value="${kst()}"></div><div class="field"><span>금액(원)</span><input type="number" inputmode="numeric" id="c-amt"></div>
    <div class="field"><span>채널</span><select class="in" id="c-ch"><option value="store">매장(페이히어 결제)</option><option value="online">온라인</option></select></div><div class="field"><span>메모</span><input type="text" id="c-memo"></div>
    <button class="btn ghost" id="c-add">카페트 판매 추가</button>
    ${carpets.length ? `<table style="margin-top:10px"><tbody>${carpets.sort((a, b) => b.data.day.localeCompare(a.data.day)).map((r) => `<tr><td>${md(r.data.day)}</td><td>${r.data.channel === 'store' ? '매장' : '온라인'}</td><td class="n">${won(r.data.amount)}</td><td class="muted small">${esc(r.data.memo || '')}</td></tr>`).join('')}</tbody></table>` : ''}</div>`;
  let timer; const persist = () => { clearTimeout(timer); timer = setTimeout(async () => { const data = { ...v, items: $('#s-items').value, memo: $('#s-memo').value, by: ME.name, updatedAt: new Date(Date.now() + 9 * 3600e3).toISOString() }; if (await save('storelog', d, data)) $('#s-saved').textContent = '저장됨 · ' + data.updatedAt.slice(11, 16) + ' ' + ME.name; }, 500); };
  el.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => { v[b.dataset.k] = Math.max(0, (+v[b.dataset.k] || 0) + +b.dataset.d); b.parentNode.querySelector('b').textContent = v[b.dataset.k]; persist(); });
  el.querySelectorAll('[data-age]').forEach((b) => b.onclick = () => { const a = b.dataset.age; v.ages = { ...v.ages, [a]: Math.max(0, (+v.ages[a] || 0) + +b.dataset.d) }; b.parentNode.querySelector('b').textContent = v.ages[a]; persist(); });
  $('#s-items').oninput = persist; $('#s-memo').oninput = persist;
  $('#s-date').onchange = (e) => { storeDate = e.target.value || kst(); render(); };
  $('#c-add').onclick = async () => { const amount = +$('#c-amt').value, day = $('#c-day').value; if (!amount || !day) { alert('판매일과 금액을 적어 주세요.'); return; }
    const id = day + '-' + Date.now().toString(36); if (await save('carpet', id, { day, amount, channel: $('#c-ch').value, tx: 1, memo: $('#c-memo').value, by: ME.name })) render(); };
}

/* ---------- 보고함 ---------- */
function postCard(p) {
  const d = p.data;
  return `<div class="card post"><div class="who"><b style="color:var(--ink)">${esc(d.staff)}</b><span>${md(d.date)}</span>${d.tag ? `<span class="badge">${esc(d.tag)}</span>` : ''}</div>
  <div class="ttl">${esc(d.title)}</div><ul>${(d.lines || []).map((l) => `<li>${esc(l)}</li>`).join('')}</ul>
  ${(d.asks || []).length ? `<div class="ask"><b>대표님 결정 대기</b><ul>${d.asks.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></div>` : ''}
  ${d.link ? `<div style="margin-top:6px"><a class="linkbtn" href="${esc(d.link)}" target="_blank" rel="noopener">자세히 보기</a></div>` : ''}</div>`;
}
function drawPosts(el) {
  const staff = ['전체', '이대리', '김사원', '송부장', '정과장', '구차장'];
  const list = rows('posts').filter((p) => postFilter === '전체' || p.data.staff === postFilter).sort((a, b) => (b.data.date || '').localeCompare(a.data.date || '') || b.id.localeCompare(a.id));
  el.innerHTML = `<h2 style="margin-top:4px">직원 보고함<small>${list.length}건</small></h2>
  <div class="seg">${staff.map((s) => `<button aria-pressed="${s === postFilter}" data-s="${s}">${s}</button>`).join('')}</div>
  ${list.map(postCard).join('') || '<div class="card empty">보고가 없습니다.</div>'}`;
  el.querySelectorAll('.seg button').forEach((b) => b.onclick = () => { postFilter = b.dataset.s; render(); });
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { $('#app').hidden = true; $('#login').hidden = false; } });
boot();
</script>
</body>
</html>
